<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Registro</title>
</head>
<body>
    <h2>Registro de movimiento</h2>

    <form action="{% url 'movs:registro' %}" method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Nuevo movimiento</button>
    </form>
    <br>
    <form action="{% url 'users:login' %}" method="post">
        {% csrf_token %}
        <button type="submit">Cerrar sesión</button>
    </form>
</body>

</html>
