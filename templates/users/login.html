<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Login</title>
</head>
<body>
    <h1>Login</h1>
    <!--Formulario en HTML-->
    <form method="post">
        <!--Cross Site Request Forgery-->
        {% csrf_token %}
        <!--Renderizar campos del formulario con <p>-->
        {{ form.as_p }}

        <input type="hidden" name="next" value="{{ next }}">

        <button type="submit">
            Entrar
        </button>
    </form>
</body>
</html>
